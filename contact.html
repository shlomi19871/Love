<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צרו קשר - אהבת חינם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Secular+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #d69e2e;
            --bg-light: #f7fafc;
            --text-dark: #2d3748;
            --text-light: #718096;
            --white: #ffffff;
            --whatsapp-color: #25d366;
            --instagram-color: #e1306c;
            --facebook-color: #1877f2;
            --x-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        nav {
            background-color: var(--primary-color);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            margin: 0 1rem;
            font-weight: 500;
            font-size: 1.1rem;
            transition: color 0.3s;
            display: inline-block;
            padding: 0.5rem 0;
        }

        nav a:hover, nav a.active {
            color: var(--secondary-color);
        }

        .contact-header {
            background-color: var(--bg-light);
            text-align: center;
            padding: 3rem 1.5rem;
            border-bottom: 2px solid var(--secondary-color);
        }

        .contact-title {
            font-family: 'Secular One', sans-serif;
            font-size: 2.6rem;
            color: var(--primary-color);
            font-weight: 400;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .contact-form {
            background: var(--white);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-top: 3px solid var(--secondary-color);
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Heebo', sans-serif;
            font-size: 1rem;
            color: var(--text-dark);
            transition: border-color 0.25s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--secondary-color);
            flex-shrink: 0;
        }

        .checkbox-group label {
            font-size: 0.95rem;
            color: var(--text-light);
            margin: 0;
            font-weight: 400;
        }

        .submit-button {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        .submit-button:hover {
            background-color: var(--secondary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        /* אזור כפתורי וואטסאפ ורשתות חברתיות נוספים */
        .social-contact-section {
            background: var(--white);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            text-align: center;
            border-top: 3px solid var(--primary-color);
        }

        .social-contact-section h3 {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .social-buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            transition: opacity 0.3s, transform 0.3s;
        }

        .social-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-whatsapp { background-color: var(--whatsapp-color); }
        .btn-instagram { background-color: var(--instagram-color); }
        .btn-facebook { background-color: var(--facebook-color); }
        .btn-x { background-color: var(--x-color); }

        footer {
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
            padding: 3rem 1.5rem;
            margin-top: 3rem;
            border-top: 2px solid var(--secondary-color);
        }

        .footer-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 2rem; 
        }

        .footer-card {
            background-color: var(--white);
            max-width: 650px;
            margin: 0 auto;
            padding: 4px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .footer-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        @media (max-width: 768px) {
            .container { padding: 2rem 1rem; }
            nav a { margin: 0 0.3rem; font-size: 0.95rem; }
            .contact-title { font-size: 1.9rem; }
            .contact-form { padding: 1.75rem 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">דף הבית</a>
        <a href="about.html">אודות</a>
        <a href="plan.html">תכנית שלנו</a>
        <a href="updates.html">עדכונים</a>
        <a href="contact.html" class="active">צרו קשר</a>
    </nav>

    <div class="contact-header">
        <div class="contact-title">צרו איתנו קשר</div>
    </div>

    <main class="container">
        <form class="contact-form">
            <div class="form-group">
                <label for="full-name">שם מלא</label>
                <input type="text" id="full-name" name="full-name" required>
            </div>

            <div class="form-group">
                <label for="phone">נייד</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="email">דוא"ל</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="subject">נושא הפנייה</label>
                <input type="text" id="subject" name="subject">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="marketing-consent" name="marketing-consent">
                <label for="marketing-consent">אני מאשר/ת קבלת עדכונים ודיוור</label>
            </div>

            <button type="submit" class="submit-button">שליחה</button>
        </form>

        <!-- דרכי התקשרות נוספות (וואטסאפ ורשתות חברתיות) -->
        <div class="social-contact-section">
            <h3>ערוצים נוספים ליצירת קשר ועוקב</h3>
            <div class="social-buttons-grid">
                <a href="https://wa.me/972500000000" target="_blank" class="social-btn btn-whatsapp">
                    💬 צרו קשר בוואטסאפ
                </a>
                <a href="https://instagram.com" target="_blank" class="social-btn btn-instagram">
                    📷 עקבו באינסטגרם
                </a>
                <a href="https://facebook.com" target="_blank" class="social-btn btn-facebook">
                    📘 עקבו בפייסבוק
                </a>
                <a href="https://x.com" target="_blank" class="social-btn btn-x">
                    🗲 עקבו ב-X
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-text">
            אהבת חינם – זו הדרך. זה הכוח. זה העתיד שלנו.
        </div>
        <div class="footer-card">
            <img src="https://i.ibb.co/GfmhbmfF/Whats-Ap-p-Image-2026-08-05-at-14-03-05-1.jpg" alt="אהבת חינם" class="footer-image">
        </div>
    </footer>

</body>
</html>
