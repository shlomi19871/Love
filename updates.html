<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עדכונים - אהבת חינם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Secular+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #d69e2e;
            --bg-light: #f7fafc;
            --text-dark: #2d3748;
            --text-light: #718096;
            --white: #ffffff;
            --whatsapp-color: #25d366;
            --instagram-color: #e1306c;
            --facebook-color: #1877f2;
            --x-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        nav {
            background-color: var(--primary-color);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            margin: 0 1rem;
            font-weight: 500;
            font-size: 1.1rem;
            transition: color 0.3s;
            display: inline-block;
            padding: 0.5rem 0;
        }

        nav a:hover, nav a.active {
            color: var(--secondary-color);
        }

        .updates-header {
            background-color: var(--bg-light);
            text-align: center;
            padding: 3rem 1.5rem;
            border-bottom: 2px solid var(--secondary-color);
        }

        .updates-title {
            font-family: 'Secular One', sans-serif;
            font-size: 2.6rem;
            color: var(--primary-color);
            font-weight: 400;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            text-align: center;
        }

        .updates-card {
            background: var(--white);
            border-radius: 12px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-top: 3px solid var(--secondary-color);
            margin-bottom: 2.5rem;
        }

        .updates-card p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* סגנון כפתורי קשר וחברתי (פריטים 4, 5, 6, 7) */
        .social-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.9rem 1.5rem;
            border-radius: 8px;
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: opacity 0.3s, transform 0.3s;
        }

        .social-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-whatsapp { background-color: var(--whatsapp-color); }
        .btn-instagram { background-color: var(--instagram-color); }
        .btn-facebook { background-color: var(--facebook-color); }
        .btn-x { background-color: var(--x-color); }

        footer {
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
            padding: 3rem 1.5rem;
            margin-top: 3rem;
            border-top: 2px solid var(--secondary-color);
        }

        .footer-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 2rem; 
        }

        .footer-card {
            background-color: var(--white);
            max-width: 650px;
            margin: 0 auto;
            padding: 4px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .footer-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        @media (max-width: 768px) {
            .container { padding: 2rem 1rem; }
            nav a { margin: 0 0.3rem; font-size: 0.95rem; }
            .updates-title { font-size: 1.9rem; }
            .updates-card p { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">דף הבית</a>
        <a href="about.html">אודות</a>
        <a href="plan.html">תכנית שלנו</a>
        <a href="updates.html" class="active">עדכונים</a>
        <a href="contact.html">צרו קשר</a>
    </nav>

    <div class="updates-header">
        <div class="updates-title">עדכונים</div>
    </div>

    <main class="container">
        <div class="updates-card">
            <p>עדכונים יבוא המשך.. תעקבו אחריי</p>
        </div>

        <!-- פריטים 4, 5, 6, 7 שנוספו גם לדף עדכונים לבקשתך -->
        <div class="social-buttons-container">
            <a href="https://wa.me/972500000000" target="_blank" class="social-btn btn-whatsapp">
                💬 צרו קשר בוואטסאפ
            </a>
            <a href="https://instagram.com" target="_blank" class="social-btn btn-instagram">
                📷 עקבו באינסטגרם
            </a>
            <a href="https://facebook.com" target="_blank" class="social-btn btn-facebook">
                📘 עקבו בפייסבוק
            </a>
            <a href="https://x.com" target="_blank" class="social-btn btn-x">
                🗲 עקבו ב-X
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-text">
            אהבת חינם – זו הדרך. זה הכוח. זה העתיד שלנו.
        </div>
        <div class="footer-card">
            <img src="https://i.ibb.co/GfmhbmfF/Whats-Ap-p-Image-2026-08-05-at-14-03-05-1.jpg" alt="אהבת חינם" class="footer-image">
        </div>
    </footer>

</body>
</html>
